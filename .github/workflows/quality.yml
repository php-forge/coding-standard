---
on:
  - pull_request
  - push

name: quality

permissions:
  contents: read

jobs:
  quality:
    uses: php-forge/actions/.github/workflows/quality.yml@4aaec87a6fdc921e51a554912ceb07dacf18916f # v3.0.2
    permissions:
      contents: read
    with:
      codespell-config: .github/linters/.codespellrc
      editorconfig-checker-config: .github/linters/.editorconfig-checker.json
      markdownlint-config: .github/linters/.markdown-lint.yml
      yamllint-targets: .github

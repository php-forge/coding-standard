---
on:
  branch_protection_rule:
  push:
    branches:
      - main
  schedule:
    - cron: "30 1 * * 6"

name: scorecard

permissions:
  contents: read

jobs:
  scorecard:
    uses: php-forge/actions/.github/workflows/scorecard.yml@4aaec87a6fdc921e51a554912ceb07dacf18916f # v3.0.2
    permissions:
      contents: read # Required to check out the repository.
      id-token: write # Required to sign published results with the GitHub OIDC token.
      security-events: write # Required to upload SARIF results to code scanning.
    with:
      publish-results: true
